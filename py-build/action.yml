name: py-build
description: The read-only half of a Python release. Builds the sdist and wheel with uv and uploads them for py-publish.
inputs:
  working-directory:
    description: The directory with pyproject.toml.
    default: .
  artifact:
    description: The artifact name py-publish downloads.
    default: release
runs:
  using: composite
  steps:
    # The build backend runs in this job: it must not be able to publish anything.
    - name: Check the job is read-only
      shell: bash
      run: |
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::py-build runs the build backend: give its job no 'id-token: write' (and no write permissions)"
          exit 1
        fi

    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: false
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv build --no-sources --out-dir dist
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.working-directory }}/dist/*
        if-no-files-found: error
        overwrite: true
