name: macos-sign
description: Sign the .app in macOS disk images with a Developer ID, make the images again, sign, notarize and staple them. Never compiles; without the certificate the files stay as they are.
inputs:
  files:
    description: Globs of the macOS .dmg files, one per line, each holding one `.app`; with a certificate, none fails.
    default: ''
  entitlements:
    description: The app's entitlements plist, from the checkout (never from the build's artifact); empty for none.
    default: ''
  certificate:
    description: The Developer ID Application certificate with its key, a base64 .p12. Empty (a fork, a pull request) leaves the files as they are.
    default: ''
  certificate-password:
    description: The .p12's password.
    default: ''
  api-key:
    description: An App Store Connect API key (the .p8's text) to notarize with; empty signs without notarizing.
    default: ''
  api-key-id:
    description: The API key's ID.
    default: ''
  api-issuer:
    description: The API key's issuer ID.
    default: ''
  required:
    description: "`true` fails without the certificate or the API key, for a release: never an unsigned or unnotarized one."
    default: 'false'
runs:
  using: node24
  main: index.ts
