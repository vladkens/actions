name: crates-publish
description: Publish a crate to crates.io through Trusted Publishing, unless this version is already there.
inputs:
  manifest-path:
    description: The crate's or workspace's Cargo.toml.
    default: Cargo.toml
  package:
    description: The package to publish; needed in a workspace without a root package.
    default: ''
  no-verify:
    description: Pass `--no-verify`, when an earlier job already ran `cargo publish --dry-run`.
    default: 'false'
  dry-run:
    description: Run `cargo publish --dry-run` instead, without a crates.io token; works in a read-only job.
    default: 'false'
outputs:
  skipped:
    description: "`true` when this version was already on crates.io."
runs:
  using: node24
  main: index.ts
  post: post.ts
