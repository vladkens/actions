name: release-commit
description: "Tell whether this run releases: a push of a `release: vX.Y.Z` commit to the default branch."
inputs:
  message:
    description: "The commit message; its first line, without a squash merge's ` (#N)`, must be `release: v` and a version."
    default: ${{ github.event.head_commit.message }}
  branch:
    description: The branch releases come from.
    default: ${{ github.event.repository.default_branch }}
outputs:
  release:
    description: "`true` for a release commit's push, `false` otherwise."
runs:
  using: node24
  main: index.ts
