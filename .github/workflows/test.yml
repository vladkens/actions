name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # actionlint for make check, pinned.
      - run: |
          mkdir -p "$HOME/.local/bin"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make check

  # Both runner OSes, which also proves the runner runs `main: index.ts` there.
  release-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - id: cargo
        uses: ./release-check
        with:
          manifest: tests/fixtures/cargo/Cargo.toml
          changelog: tests/fixtures/changelog.md
          message: |
            release: v1.0.1 (#12)

            * squashed body
      - env:
          TAG: ${{ steps.cargo.outputs.tag }}
          VERSION: ${{ steps.cargo.outputs.version }}
          NOTES: ${{ steps.cargo.outputs.notes }}
          NOTES_FILE: ${{ steps.cargo.outputs.notes-file }}
        run: |
          test "$TAG" = v1.0.1
          test "$VERSION" = 1.0.1
          test "$NOTES" = "$(printf '### Features\n\n- Added one (#12)')"
          test "$(cat "$NOTES_FILE")" = "$NOTES"

      - id: pyproject
        uses: ./release-check
        with:
          manifest: tests/fixtures/pyproject/pyproject.toml
          changelog: tests/fixtures/changelog.md
          plans: tests/fixtures/plans/missing # end to end: a missing plans directory is skipped
          message: 'release: v1.0.10'
      - env:
          TAG: ${{ steps.pyproject.outputs.tag }}
          NOTES: ${{ steps.pyproject.outputs.notes }}
        run: |
          test "$TAG" = v1.0.10
          grep -q '^- Fixed ten$' <<< "$NOTES"
          ! grep -q 'Added one\|^---' <<< "$NOTES"

      # Each of these must fail.
      - id: wrong-version
        continue-on-error: true
        uses: ./release-check
        with:
          manifest: tests/fixtures/cargo/Cargo.toml
          changelog: tests/fixtures/changelog.md
          message: 'release: v1.0.10'
      - id: not-a-release
        continue-on-error: true
        uses: ./release-check
        with:
          manifest: tests/fixtures/cargo/Cargo.toml
          changelog: tests/fixtures/changelog.md
          message: 'fix: v1.0.1'
      - id: no-entry
        continue-on-error: true
        uses: ./release-check
        with:
          manifest: tests/fixtures/npm/package.json
          changelog: tests/fixtures/changelog.md
          message: 'release: v0.9.0'
      - id: no-changelog
        continue-on-error: true
        uses: ./release-check
        with:
          manifest: tests/fixtures/cargo/Cargo.toml
          changelog: tests/fixtures/missing.md
          message: 'release: v1.0.1'
      # Except on a pull request, a release PR's check, which leaves the releasers to the merge.
      - id: not-a-releaser
        continue-on-error: true
        uses: ./release-check
        with:
          manifest: tests/fixtures/cargo/Cargo.toml
          changelog: tests/fixtures/changelog.md
          message: 'release: v1.0.1'
          releasers: someone-else
      - id: unfinished-plans
        continue-on-error: true
        uses: ./release-check
        with:
          manifest: tests/fixtures/cargo/Cargo.toml
          changelog: tests/fixtures/changelog.md
          plans: tests/fixtures/plans/bad
          message: 'release: v1.0.1'
      # This repo's own v1.0.0 tag: on another commit after a merge, already released before it.
      - id: released
        continue-on-error: true
        uses: ./release-check
        with:
          manifest: tests/fixtures/workspace/Cargo.toml
          changelog: tests/fixtures/changelog.md
          plans: tests/fixtures/plans/good
          message: 'release: v1.0.0'
      - env:
          OUTCOMES: >-
            ${{ steps.wrong-version.outcome }} ${{ steps.not-a-release.outcome }}
            ${{ steps.no-entry.outcome }} ${{ steps.no-changelog.outcome }}
            ${{ steps.not-a-releaser.outcome }} ${{ steps.unfinished-plans.outcome }}
            ${{ steps.released.outcome }}
          RELEASER: ${{ github.event_name == 'pull_request' && 'success' || 'failure' }}
        run: test "$OUTCOMES" = "failure failure failure failure $RELEASER failure failure"

      # The run's own actor among the releasers.
      - uses: ./release-check
        with:
          manifest: tests/fixtures/cargo/Cargo.toml
          changelog: tests/fixtures/changelog.md
          message: 'release: v1.0.1'
          releasers: someone-else, ${{ github.triggering_actor }}

  # A release only on a push of a release title to the branch.
  release-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: release
        uses: ./release-commit
        with:
          message: |
            release: v1.0.1 (#12)

            * squashed body
          branch: ${{ github.ref_name }}
      - id: other-title
        uses: ./release-commit
        with:
          message: 'release: version change'
          branch: ${{ github.ref_name }}
      - id: other-branch
        uses: ./release-commit
        with:
          message: 'release: v1.0.1'
          branch: not-${{ github.ref_name }}
      - env:
          RELEASES: ${{ steps.release.outputs.release }} ${{ steps.other-title.outputs.release }} ${{ steps.other-branch.outputs.release }}
          PUSH: ${{ github.event_name == 'push' }}
        run: test "$RELEASES" = "$PUSH false false"

  crates-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: new
        uses: ./crates-publish
        with:
          manifest-path: tests/fixtures/crate/Cargo.toml
          dry-run: true
      - id: published
        uses: ./crates-publish
        with:
          manifest-path: tests/fixtures/crate-published/Cargo.toml
          dry-run: true
      - env:
          SKIPPED: ${{ steps.new.outputs.skipped }} ${{ steps.published.outputs.skipped }}
        run: test "$SKIPPED" = "false true"
      # Not on crates.io and not a dry run: must stop for the missing token before publishing.
      - id: no-token
        continue-on-error: true
        uses: ./crates-publish
        with:
          manifest-path: tests/fixtures/crate/Cargo.toml
      - env:
          OUTCOME: ${{ steps.no-token.outcome }}
        run: test "$OUTCOME" = failure

  # Real releases of this repo under throwaway tags, deleted at the end.
  github-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: test-${{ github.run_id }}-${{ github.run_attempt }}
      OTHER: v0.0.0-test-${{ github.run_id }}-${{ github.run_attempt }} # release-check's tags start with v
    steps:
      - uses: actions/checkout@v7

      - run: |
          mkdir dist
          echo one > dist/fix-dev-a.txt
      - id: first
        uses: ./github-release
        with:
          tag: ${{ env.TAG }}
          notes: first
          files: dist/*
          rename-from: fix-dev-
          rename-to: fix-${{ env.TAG }}-
      - env:
          FILES: ${{ steps.first.outputs.files }}
        run: |
          test "$FILES" = "dist/fix-$TAG-a.txt"
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$GITHUB_SHA"
          test "$(gh release view "$TAG" --json body,assets --jq '.body + "|" + ([.assets[].name] | sort | join(","))')" = "first|fix-$TAG-a.txt"

      # A re-run with a rebuilt `a` and a new `b`: `a` stays as published, `b` is added.
      - run: |
          rm dist/*
          echo rebuilt > dist/fix-dev-a.txt
          echo two > dist/fix-dev-b.txt
      - id: second
        uses: ./github-release
        with:
          tag: ${{ env.TAG }}
          notes: second
          files: dist/*
          rename-from: fix-dev-
          rename-to: fix-${{ env.TAG }}-
      - run: |
          test "$(cat "dist/fix-$TAG-a.txt")" = one
          test "$(gh release view "$TAG" --json body,assets --jq '.body + "|" + ([.assets[].name] | sort | join(","))')" = "first|fix-$TAG-a.txt,fix-$TAG-b.txt"

      # A release without assets (a library).
      - uses: ./github-release
        with:
          tag: ${{ env.TAG }}-bare
          notes: bare
      - run: test "$(gh release view "$TAG-bare" --json body,assets --jq '.body + "|" + (.assets | length | tostring)')" = "bare|0"

      # A tag left on another commit: both release-check and github-release refuse it.
      - run: |
          # Another commit with this one's tree: GITHUB_TOKEN may not tag a commit whose workflow
          # files differ from main's (it has no `workflows` permission).
          other=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" -f message=other -f "tree=$(git rev-parse 'HEAD^{tree}')" -f "parents[]=$GITHUB_SHA" --jq .sha)
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$OTHER" -f "sha=$other"
          echo '{ "version": "'"${OTHER#v}"'" }' > "$RUNNER_TEMP/package.json"
          printf '## %s\n\n- Changed\n' "$OTHER" > "$RUNNER_TEMP/changelog.md"
      - id: check-other-commit
        continue-on-error: true
        uses: ./release-check
        with:
          manifest: ${{ runner.temp }}/package.json
          changelog: ${{ runner.temp }}/changelog.md
          plans: tests/fixtures/plans/good
          message: 'release: ${{ env.OTHER }}'
      - id: other-commit
        continue-on-error: true
        uses: ./github-release
        with:
          tag: ${{ env.OTHER }}
          notes: other
      - env:
          OUTCOMES: ${{ steps.check-other-commit.outcome }} ${{ steps.other-commit.outcome }}
        run: |
          test "$OUTCOMES" = "failure failure"
          ! gh release view "$OTHER"

      - if: always()
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release delete "$TAG-bare" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$OTHER" || true

  dev-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: test-dev-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - run: |
          mkdir dist
          echo one > dist/x-a.txt
          echo one > dist/x-b.txt
      - id: first
        uses: ./dev-release
        with:
          tag: ${{ env.TAG }}
          files: dist/*
      # Skipped only when main really moved on during the run; then there is nothing more to check.
      - if: steps.first.outputs.skipped != 'false'
        run: test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" != "$GITHUB_SHA"
      - if: steps.first.outputs.skipped == 'false'
        run: |
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$GITHUB_SHA"
          test "$(gh release view "$TAG" --json isPrerelease,assets --jq '"\(.isPrerelease)|" + ([.assets[].name] | sort | join(","))')" = "true|x-a.txt,x-b.txt"

      # The next build drops `b`, adds `c` and changes `a`.
      - if: steps.first.outputs.skipped == 'false'
        run: |
          rm dist/x-b.txt
          echo two > dist/x-a.txt
          echo two > dist/x-c.txt
      - id: second
        if: steps.first.outputs.skipped == 'false'
        uses: ./dev-release
        with:
          tag: ${{ env.TAG }}
          title: Test build
          files: dist/*
      - if: steps.second.outputs.skipped == 'false'
        run: |
          test "$(gh release view "$TAG" --json name,assets --jq '.name + "|" + ([.assets[].name] | sort | join(","))')" = "Test build|x-a.txt,x-c.txt"
          test "$(gh release download "$TAG" --pattern x-a.txt --output -)" = two

      - if: always()
        run: gh release delete "$TAG" --cleanup-tag --yes || true

  # rust-build → rust-publish with a fake build, as a repo's workflow uses them: the dev path,
  # published under a throwaway tag. The release path needs a release commit and is proven by the
  # first release of a repo using them.
  rust-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./rust-build
        with:
          dist: mkdir -p target/distrib && echo one > target/distrib/fixture-dev-a.txt
          cache: false
          dev-version: false # no Cargo.toml at this repo's root; dev-version is tested below
          dev: true
          artifact: release-test
      # Without dev, a plain push builds nothing (a manual run always builds).
      - if: github.event_name == 'push'
        uses: ./rust-build
        with:
          dist: mkdir -p target/distrib && echo one > target/distrib/fixture-dev-b.txt
          cache: false
          dev-version: false
          artifact: release-nodev

  # A non-release build's version from `git describe` against this repo's vX.Y.Z tags.
  dev-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: stamp
        uses: ./dev-version
        with:
          manifest-path: tests/fixtures/crate/Cargo.toml
      - env:
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-g[0-9a-f]+$ ]]
          grep -qx "version = \"$VERSION\"" tests/fixtures/crate/Cargo.toml
          grep -qx "version = \"$VERSION\"" tests/fixtures/crate/Cargo.lock
          cargo build --locked --manifest-path tests/fixtures/crate/Cargo.toml

  # rust-build must refuse a job that could publish.
  rust-build-write:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: build
        continue-on-error: true
        uses: ./rust-build
        with:
          dist: mkdir -p target/distrib && echo one > target/distrib/fixture-dev-a.txt
          artifact: release-test-write
      - env:
          OUTCOME: ${{ steps.build.outcome }}
        run: test "$OUTCOME" = failure

  rust-publish:
    needs: rust-build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: test-publish-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      # Files not named `<name>-dev*` are refused before anything is published.
      - id: wrong-name
        continue-on-error: true
        uses: ./rust-publish
        with:
          name: other
          crates: false
          artifact: release-test
          dev-tag: ${{ env.TAG }}
          dev-branch: ${{ github.ref_name }}
      - id: publish
        uses: ./rust-publish
        with:
          name: fixture
          crates: false
          artifact: release-test
          dev-tag: ${{ env.TAG }}
          dev-branch: ${{ github.ref_name }}
      # No dev build to download: no dev pre-release, and no failure.
      - id: nodev
        if: github.event_name == 'push'
        uses: ./rust-publish
        with:
          name: fixture
          crates: false
          artifact: release-nodev
          dev-tag: ${{ env.TAG }}-nodev
          dev-branch: ${{ github.ref_name }}
      # A pack command's files and update.txt, not its subfolders; then a file it names wrong.
      - run: rm -rf target/distrib # nodev's marker
      - id: pack
        uses: ./rust-publish
        with:
          name: fixture
          crates: false
          artifact: release-test
          dev-tag: ${{ env.TAG }}-pack
          dev-branch: ${{ github.ref_name }}
          pack: |
            cd target/distrib
            mkdir bin && mv fixture-dev-a.txt bin/ && tar czf fixture-dev-x.tar.gz bin
            echo "$LABEL|$TAG" > update.txt
      - id: pack-wrong
        continue-on-error: true
        uses: ./rust-publish
        with:
          name: fixture
          crates: false
          artifact: release-test
          dev-tag: ${{ env.TAG }}-pack
          dev-branch: ${{ github.ref_name }}
          pack: touch target/distrib/other-dev-a.txt
      - env:
          WRONG: ${{ steps.wrong-name.outcome }}
          FILES: ${{ steps.publish.outputs.files }}
          RELEASED: ${{ steps.publish.outputs.tag }}
          NODEV: ${{ steps.nodev.outcome }}
          PACK_WRONG: ${{ steps.pack-wrong.outcome }}
        run: |
          test "$WRONG $PACK_WRONG" = "failure failure"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$NODEV" = success
            if gh release view "$TAG-nodev" > /dev/null 2>&1; then exit 1; fi
          fi
          test "$FILES" = target/distrib/fixture-dev-a.txt
          test -z "$RELEASED"
          test "$(gh release view "$TAG" --json isPrerelease,assets --jq '"\(.isPrerelease)|" + ([.assets[].name] | join(","))')" = "true|fixture-dev-a.txt"
          # Signed by this repo's own workflow: no signer flags needed.
          gh release download "$TAG" --pattern fixture-dev-a.txt --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/fixture-dev-a.txt" -R "$GITHUB_REPOSITORY"
          test "$(gh release view "$TAG-pack" --json assets --jq '[.assets[].name] | sort | join(",")')" = "fixture-dev-x.tar.gz,update.txt"
          test "$(gh release download "$TAG-pack" --pattern update.txt --output -)" = "dev|"
      - if: always()
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release delete "$TAG-nodev" --cleanup-tag --yes || true
          gh release delete "$TAG-pack" --cleanup-tag --yes || true

  # py-build → py-publish on a package fixture. Outside a release commit py-publish does nothing;
  # the release path is proven by the first release of a repo using them.
  py-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./py-build
        with:
          working-directory: tests/fixtures/pypkg
          artifact: py-test
      - run: test "$(ls tests/fixtures/pypkg/dist)" = "$(printf 'fixture_pkg-0.1.0-py2.py3-none-any.whl\nfixture_pkg-0.1.0.tar.gz')"

  py-build-write:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: build
        continue-on-error: true
        uses: ./py-build
        with:
          working-directory: tests/fixtures/pypkg
          artifact: py-test-write
      - env:
          OUTCOME: ${{ steps.build.outcome }}
        run: test "$OUTCOME" = failure

  py-publish:
    needs: py-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: publish
        uses: ./py-publish
        with:
          working-directory: tests/fixtures/pypkg
          artifact: py-test
      - env:
          RELEASED: ${{ steps.publish.outputs.tag }}
        run: |
          test -z "$RELEASED"
          test ! -e tests/fixtures/pypkg/dist

  # homebrew-bump against a local bare tap: a first run commits url/version/sha256, a second
  # changes nothing, and no tag means no work.
  homebrew-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git init --quiet --bare -b main "$RUNNER_TEMP/tap.git"
          git init --quiet -b main "$RUNNER_TEMP/seed"
          printf 'class Fixture < Formula\n  url "https://x/fixture-v0.0.1.tar.gz"\n  version "0.0.1"\n  sha256 "aaaa"\nend\n' > "$RUNNER_TEMP/seed/fixture.rb"
          git -C "$RUNNER_TEMP/seed" add fixture.rb
          git -C "$RUNNER_TEMP/seed" -c user.name=t -c user.email=t@t commit --quiet -m init
          git -C "$RUNNER_TEMP/seed" push --quiet "$RUNNER_TEMP/tap.git" main
          echo archive > "$RUNNER_TEMP/fixture-v1.2.3.tar.gz"
      - id: none
        uses: ./homebrew-bump
        with:
          tap: file://${{ runner.temp }}/tap.git
          token: unused
      - id: first
        uses: ./homebrew-bump
        with:
          tag: v1.2.3
          file: ${{ runner.temp }}/fixture-v1.2.3.tar.gz
          tap: file://${{ runner.temp }}/tap.git
          formula: fixture.rb
          token: unused
      - id: again
        uses: ./homebrew-bump
        with:
          tag: v1.2.3
          file: ${{ runner.temp }}/fixture-v1.2.3.tar.gz
          tap: file://${{ runner.temp }}/tap.git
          formula: fixture.rb
          token: unused
      - env:
          CHANGED: ${{ steps.none.outputs.changed }} ${{ steps.first.outputs.changed }} ${{ steps.again.outputs.changed }}
        run: |
          test "$CHANGED" = "false true false"
          formula=$(git --git-dir="$RUNNER_TEMP/tap.git" show main:fixture.rb)
          grep -qx '  version "1.2.3"' <<< "$formula"
          grep -qx "  url \"https://github.com/$GITHUB_REPOSITORY/releases/download/v1.2.3/fixture-v1.2.3.tar.gz\"" <<< "$formula"
          grep -qx "  sha256 \"$(sha256sum "$RUNNER_TEMP/fixture-v1.2.3.tar.gz" | cut -d' ' -f1)\"" <<< "$formula"
          test "$(git --git-dir="$RUNNER_TEMP/tap.git" log -1 --format='%an | %s')" = "github-actions[bot] | fixture v1.2.3"

  # rust-dist on a real binary crate: Apple natively, Linux through cargo-cross.
  rust-dist-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - id: dist
        uses: ./rust-dist
        with:
          targets: aarch64-apple-darwin x86_64-unknown-linux-gnu
          profile: dist # with debug info: the macOS archive gets fixture-bin.dSYM
          name: fixture
          working-directory: tests/fixtures/bin
      - working-directory: tests/fixtures/bin
        env:
          FILES: ${{ steps.dist.outputs.files }}
        run: |
          test "$FILES" = "$(printf 'target/distrib/fixture-dev-aarch64-apple-darwin.tar.gz\ntarget/distrib/fixture-dev-x86_64-unknown-linux-gnu.tar.gz')"
          test "$(tar tzf target/distrib/fixture-dev-x86_64-unknown-linux-gnu.tar.gz | sort | tr '\n' ' ')" = "fixture-bin readme.md "
          mac=$(tar tzf target/distrib/fixture-dev-aarch64-apple-darwin.tar.gz)
          grep -qx fixture-bin <<< "$mac"
          grep -qx readme.md <<< "$mac"
          grep -q '^fixture-bin.dSYM/Contents/Resources/DWARF/' <<< "$mac"
          mkdir unpacked
          tar xzf target/distrib/fixture-dev-x86_64-unknown-linux-gnu.tar.gz -C unpacked
          file unpacked/fixture-bin | grep -q 'ELF 64-bit.*x86-64'
          tar xzf target/distrib/fixture-dev-aarch64-apple-darwin.tar.gz -C unpacked
          test "$(unpacked/fixture-bin)" = "fixture-bin 0.1.0"

  rust-dist-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: dist
        uses: ./rust-dist
        with:
          targets: x86_64-unknown-linux-gnu
          name: fixture
          working-directory: tests/fixtures/bin
      # Apple targets need a Mac.
      - id: apple
        continue-on-error: true
        uses: ./rust-dist
        with:
          targets: aarch64-apple-darwin
          working-directory: tests/fixtures/bin
      - working-directory: tests/fixtures/bin
        env:
          OUTCOME: ${{ steps.apple.outcome }}
        run: |
          test "$OUTCOME" = failure
          mkdir unpacked
