# Throwaway: git 2.56's crash on dev-version's old fetch, against wavo-app checked out as its CI does.
name: tmp-git-repro
on: pull_request
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vladkens/wavo-app
          path: old
      - uses: actions/checkout@v7
        with:
          repository: vladkens/wavo-app
          path: new
      - run: git --version
      - name: old fetch, with --filter=tree:0
        working-directory: old
        run: |
          if git fetch --quiet --unshallow --filter=tree:0 --tags origin; then echo "old: no crash"; else echo "old: crashed, exit $?"; fi
      - name: new fetch, without the filter
        working-directory: new
        run: |
          git fetch --quiet --unshallow --tags origin
          echo "new: ok, $(git rev-list --count HEAD) commits"
