name: rust-publish
description: The writing half of a Rust release. Publishes rust-build's files as the dev pre-release, or a release commit to crates.io and GitHub. Never compiles.
inputs:
  files:
    description: Expect release files from rust-build; `false` for a crate without binaries.
    default: "true"
  crates:
    description: Publish the crate to crates.io on a release commit (Trusted Publishing).
    default: "true"
  dev:
    description: Publish the default branch's files as the rolling dev pre-release.
    default: "true"
  name:
    description: The files' prefix, renamed from `<name>-dev` to `<name>-vX.Y.Z` on a release; the repo's name when empty.
    default: ""
  releasers:
    description: GitHub logins allowed to release, separated by spaces or commas. A release commit merged by anyone else fails before anything is published; one of them re-runs it.
    default: ${{ github.repository_owner }}
  artifact:
    description: The artifact rust-build uploaded.
    default: release
  dev-tag:
    description: The dev pre-release's tag.
    default: dev
  dev-branch:
    description: The branch whose pushes update the dev pre-release; the default branch when empty.
    default: ""
  pack:
    description: A command that makes the release files from rust-build's, run in the checkout after the download with `LABEL` (`dev` or the tag) and `TAG` (empty for dev) plus the step's own env. Of the files it leaves at the top of target/distrib, only `<name>-dev*` ones, `update.txt` and, on a release, `<name>-<tag>*` ones it names itself are published (any other fails the step); its subfolders are not. The `<name>-dev*` ones are renamed to `<name>-<tag>*` on a release like rust-build's; `update.txt` and its own `<name>-<tag>*` ones are published as they are (an update feed signed over their names, say). Must not compile.
    default: ""
outputs:
  tag:
    description: The released tag; empty when this run released nothing.
    value: ${{ steps.check.outputs.tag }}
  files:
    description: The published files' local paths, one per line.
    value: ${{ steps.release.outputs.files || steps.dev.outputs.files }}
runs:
  using: composite
  steps:
    # Decided here from the event, never from the artifact: the build job's dependencies could
    # have written anything into it.
    - id: commit
      uses: $/release-commit
    - id: mode
      name: Decide what to publish
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        RELEASE: ${{ steps.commit.outputs.release }}
        DEV_BRANCH: ${{ inputs.dev-branch || github.event.repository.default_branch }}
        DEV: ${{ inputs.dev }}
        NAME: ${{ inputs.name || github.event.repository.name }}
        PRIVATE: ${{ github.event.repository.private }}
      run: |
        mode=none
        if [ "$RELEASE" = true ]; then
          mode=release
        elif [ "$DEV" = true ] && { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ "$GITHUB_REF_NAME" = "$DEV_BRANCH" ]; then
          mode=dev
        fi
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "rust-publish: $mode ($EVENT on $GITHUB_REF_NAME)"
        if [ "$mode" != none ] && [ "$PRIVATE" = true ]; then
          echo "::notice::private repo: no attestations (GitHub offers them there only on Enterprise Cloud)"
        fi

    # A release commit is checked first: the pack command gets its tag.
    - id: check
      if: steps.mode.outputs.mode == 'release'
      uses: $/release-check
      with:
        releasers: ${{ inputs.releasers }}
    - id: download
      if: steps.mode.outputs.mode != 'none' && inputs.files == 'true'
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: target/distrib # git-ignored, so cargo publish packs a clean tree
    # rust-build without `dev: true` builds nothing outside release commits and leaves a marker.
    - id: built
      if: steps.download.outcome == 'success'
      shell: bash
      run: |
        if [ -e target/distrib/no-dev-build ]; then
          echo "no dev build in this run (rust-build's dev is off): no dev pre-release"
          echo "files=false" >> "$GITHUB_OUTPUT"
        else
          echo "files=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.built.outputs.files == 'true' && inputs.pack != ''
      name: Pack the release files
      shell: bash
      env:
        PACK: ${{ inputs.pack }}
        LABEL: ${{ steps.check.outputs.tag || 'dev' }}
        TAG: ${{ steps.check.outputs.tag }}
      # Its own bash with the step's -e and pipefail; LABEL, TAG and the step env are exported to it.
      run: bash -eo pipefail -c "$PACK"
    - if: steps.built.outputs.files == 'true'
      name: Check the files
      shell: bash
      env:
        PREFIX: ${{ steps.mode.outputs.name }}-dev
        PACK: ${{ inputs.pack }}
        # `<name>-<tag>` on a release with a pack command, else empty.
        TAGGED: ${{ inputs.pack != '' && steps.check.outputs.tag != '' && format('{0}-{1}', steps.mode.outputs.name, steps.check.outputs.tag) || '' }}
      run: |
        # Fails the step; under test.yml's EXPECT_FAILURE a plain line, not an annotation.
        refuse() {
          if [ -n "${EXPECT_FAILURE:-}" ]; then echo "expected failure: $1"; else echo "::error::$1"; fi

          exit 1
        }

        for f in target/distrib/* target/distrib/.[!.]*; do
          [ -e "$f" ] || [ -L "$f" ] || continue
          name=${f#target/distrib/}
          # A pack command's subfolders (the binaries it packed) aren't published; its update.txt is.
          # A symlink is never skipped: the check below refuses it.
          if [ -n "$PACK" ] && [ -d "$f" ] && [ ! -L "$f" ]; then
            continue
          fi

          if [ -n "$PACK" ] && [ "$name" = update.txt ] && [ ! -L "$f" ]; then
            continue
          fi

          # A release's files the pack command named itself, as the rename would: published as they
          # are, so a feed signed over their names holds. github-release's rename replaces
          # `<name>-dev` anywhere in a name, over what is there: it must not touch these.
          if [ -n "$TAGGED" ] && [[ "$name" == "$TAGGED"* ]] && [ -f "$f" ] && [ ! -L "$f" ]; then
            twin=$PREFIX${name#"$TAGGED"}
            if [[ "$name" == *"$PREFIX"* ]]; then
              refuse "found '$name', named for the tag but containing '$PREFIX': the release's rename would change its name; expected no '$PREFIX' in it"
            fi

            if [ -f "target/distrib/$twin" ]; then
              refuse "found '$twin' beside '$name': the release's rename would overwrite '$name' with it; expected only one of them"
            fi

            continue
          fi

          if [ -L "$f" ] || [ ! -f "$f" ] || [[ "$name" != "$PREFIX"* ]]; then
            refuse "unexpected '$name' in the release files: expected regular files named '$PREFIX*'${TAGGED:+ or '$TAGGED*'}"
          fi
        done

    # A release commit: crates.io, the tag and the GitHub release.
    # https://crates.io/docs/trusted-publishing
    - id: auth
      if: steps.mode.outputs.mode == 'release' && inputs.crates == 'true'
      uses: rust-lang/crates-io-auth-action@v1
    - if: steps.mode.outputs.mode == 'release' && inputs.crates == 'true'
      uses: $/crates-publish
      with:
        token: ${{ steps.auth.outputs.token }}
        no-verify: true # rust-build ran the dry run; this job never compiles
    - id: release
      if: steps.mode.outputs.mode == 'release'
      uses: $/github-release
      with:
        tag: ${{ steps.check.outputs.tag }}
        notes: ${{ steps.check.outputs.notes }}
        files: ${{ inputs.files == 'true' && 'target/distrib/*' || '' }}
        rename-from: ${{ steps.mode.outputs.name }}-dev
        rename-to: ${{ steps.mode.outputs.name }}-${{ steps.check.outputs.tag }}
    # Attestations need a public repo (or Enterprise Cloud): a private one skips them.
    - if: steps.mode.outputs.mode == 'release' && inputs.files == 'true' && !github.event.repository.private
      uses: actions/attest@v4
      with:
        subject-path: ${{ steps.release.outputs.files }}

    # Any other push to the dev branch: the rolling pre-release.
    - id: dev
      if: steps.mode.outputs.mode == 'dev' && steps.built.outputs.files == 'true'
      uses: $/dev-release
      with:
        tag: ${{ inputs.dev-tag }}
        files: target/distrib/*
    - if: steps.dev.outputs.skipped == 'false' && !github.event.repository.private
      uses: actions/attest@v4
      with:
        subject-path: ${{ steps.dev.outputs.files }}
