name: py-publish
description: The writing half of a Python release. On a release commit checks py-build's files into dist/ and creates the tag and GitHub release; the workflow's next step uploads them to PyPI. Never builds.
inputs:
  working-directory:
    description: The directory with pyproject.toml and changelog.md.
    default: .
  releasers:
    description: GitHub logins allowed to release, separated by spaces or commas. A release commit merged by anyone else fails before anything is published; one of them re-runs it.
    default: ${{ github.repository_owner }}
  artifact:
    description: The artifact py-build uploaded.
    default: release
outputs:
  tag:
    description: The released tag; empty when this run released nothing, so the PyPI upload after it is skipped.
    value: ${{ steps.check.outputs.tag }}
runs:
  using: composite
  steps:
    # Decided from the event, never from the artifact: the build backend could have written anything.
    - id: release
      uses: $/release-commit

    - id: check
      if: steps.release.outputs.release == 'true'
      uses: $/release-check
      with:
        releasers: ${{ inputs.releasers }}
        manifest: ${{ inputs.working-directory }}/pyproject.toml
        changelog: ${{ inputs.working-directory }}/changelog.md
    - if: steps.release.outputs.release == 'true'
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.working-directory }}/dist
    - if: steps.release.outputs.release == 'true'
      name: Check the files
      shell: bash
      env:
        DIST: ${{ inputs.working-directory }}/dist
        PYPROJECT: ${{ inputs.working-directory }}/pyproject.toml
        VERSION: ${{ steps.check.outputs.version }}
      run: |
        name=$(python3 -c 'import re, sys, tomllib; print(re.sub(r"[-_.]+", "_", tomllib.load(open(sys.argv[1], "rb"))["project"]["name"]).lower())' "$PYPROJECT")
        count=0
        for f in "$DIST"/* "$DIST"/.[!.]*; do
          [ -e "$f" ] || [ -L "$f" ] || continue
          file=${f#"$DIST"/}
          if [ -L "$f" ] || [ ! -f "$f" ] || { [ "$file" != "$name-$VERSION.tar.gz" ] && [[ "$file" != "$name-$VERSION-"*.whl ]]; }; then
            echo "::error::unexpected '$file' in the release files: expected $name-$VERSION.tar.gz or $name-$VERSION-*.whl"
            exit 1
          fi

          count=$((count + 1))
        done

        if [ "$count" = 0 ]; then
          echo "::error::no release files in the artifact: expected $name-$VERSION.tar.gz or $name-$VERSION-*.whl"
          exit 1
        fi

    - if: steps.release.outputs.release == 'true'
      uses: $/github-release
      with:
        tag: ${{ steps.check.outputs.tag }}
        notes: ${{ steps.check.outputs.notes }}
