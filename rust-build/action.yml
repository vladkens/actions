name: rust-build
description: The read-only half of a Rust release. Checks a release commit, builds the release files and uploads them for rust-publish.
inputs:
  targets:
    description: Rust targets to build the binaries for, packed with the readme and license as `<name>-dev-<target>`; empty for a crate without binaries. Apple ones need a macOS runner.
    default: ''
  name:
    description: The archives' prefix; the repo's name when empty.
    default: ''
  profile:
    description: The cargo profile `targets` builds; with debug info Apple targets also ship `<bin>.dSYM`.
    default: release
  dist:
    description: Instead of `targets`, a command that builds the release files into target/distrib, named `<name>-dev*`.
    default: ''
  dev:
    description: Also build the files on other pushes, for rust-publish's rolling dev pre-release. Off by default; release commits and manual runs always build.
    default: 'false'
  crates:
    description: On a release commit, run `cargo publish --dry-run`.
    default: 'true'
  dev-version:
    description: Outside release commits, build with the version `git describe` gives (e.g. 0.9.0-12-g3672a1b).
    default: 'true'
  cache:
    description: Cache cargo's registry and target/ (Swatinem/rust-cache).
    default: 'true'
  cache-directories:
    description: More directories for that cache, one per line (e.g. cross toolchains).
    default: ''
  artifact:
    description: The artifact name rust-publish downloads.
    default: release
runs:
  using: composite
  steps:
    # Dependencies' build scripts run in this job: it must not be able to publish anything.
    - name: Check the job is read-only
      shell: bash
      run: |
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::rust-build runs build scripts: give its job no 'id-token: write' (and no write permissions)"
          exit 1
        fi

    # Only a `release: v<version>` title releases; any other builds as a dev commit.
    - id: release
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        title=${MESSAGE%%$'\n'*}
        title=${title%$'\r'}
        if [ "$EVENT" = push ] && [[ $title =~ ^release:\ v[0-9][^\ ]*(\ \(#[0-9]+\))?$ ]]; then
          echo "is=true" >> "$GITHUB_OUTPUT"
        fi
    - id: check
      if: steps.release.outputs.is == 'true'
      uses: $/release-check
    - if: steps.check.outcome == 'success' && inputs.crates == 'true'
      uses: $/crates-publish
      with:
        dry-run: true

    - id: plan
      name: Decide whether to build the files
      shell: bash
      env:
        FILES: ${{ inputs.targets != '' || inputs.dist != '' }}
        RELEASE: ${{ steps.check.outcome == 'success' }}
        DEV: ${{ inputs.dev }}
        EVENT: ${{ github.event_name }}
      run: |
        build=false
        if [ "$FILES" = true ] && { [ "$RELEASE" = true ] || [ "$DEV" = true ] || [ "$EVENT" = workflow_dispatch ]; }; then
          build=true
        elif [ "$FILES" = true ]; then
          # Tells rust-publish there is nothing to put up, so it skips the dev pre-release quietly.
          echo "no release files on this push: not a release commit, and dev is off"
          mkdir -p target/distrib
          : > target/distrib/no-dev-build
        fi
        echo "build=$build" >> "$GITHUB_OUTPUT"
        echo "files=$FILES" >> "$GITHUB_OUTPUT"

    - if: steps.plan.outputs.build == 'true' && inputs.cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        cache-directories: |
          ${{ inputs.cache-directories }}
          ${{ inputs.targets != '' && '~/.cache/cargo-cross' || '' }}
    # After the cache, whose key hashes Cargo.lock. A release keeps its plain version: its files
    # are published as they are.
    - if: steps.plan.outputs.build == 'true' && inputs.dev-version == 'true' && steps.check.outcome == 'skipped'
      uses: $/dev-version
    - if: steps.plan.outputs.build == 'true' && inputs.targets != ''
      uses: $/rust-dist
      with:
        targets: ${{ inputs.targets }}
        name: ${{ inputs.name }}
        profile: ${{ inputs.profile }}
    - if: steps.plan.outputs.build == 'true' && inputs.targets == ''
      name: Build the release files
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
      run: eval "$DIST"
    - if: steps.plan.outputs.files == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: target/distrib/*
        if-no-files-found: error
        overwrite: true
